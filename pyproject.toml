[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deobf-agent"
version = "0.1.0"
description = "Obfuskatsiyalangan psevdokodni (IDA/Ghidra) LLM yordamida soddalashtiruvchi va tushuntiruvchi agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.0", "pydantic>=2.0", "flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
deobf = "deobf_agent.cli:main"

[tool.setuptools.packages.find]
include = ["deobf_agent*"]

[tool.setuptools.package-data]
deobf_agent = ["data/*.h", "web/templates/*.html"]
