<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6677; --border: #dde1e8;
  --accent: #2f6fde; --accent-soft: #e6eefc; --ok: #1d8a4e; --ok-soft: #e3f4ea;
  --warn: #a86400; --warn-soft: #fdf1dc; --bad: #c0352b; --bad-soft: #fbe5e3; --code-bg: #f3f5f8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --panel: #1b1f27; --text: #e4e7ee; --muted: #9aa3b5; --border: #2d3340;
    --accent: #6c9cf0; --accent-soft: #1f2b44; --ok: #4cc283; --ok-soft: #16301f;
    --warn: #e0a440; --warn-soft: #33270f; --bad: #ef6b60; --bad-soft: #3a1a18; --code-bg: #151920;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #1b1f27; --text: #e4e7ee; --muted: #9aa3b5; --border: #2d3340;
  --accent: #6c9cf0; --accent-soft: #1f2b44; --ok: #4cc283; --ok-soft: #16301f;
  --warn: #e0a440; --warn-soft: #33270f; --bad: #ef6b60; --bad-soft: #3a1a18; --code-bg: #151920;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 1.6rem; margin: 0 0 4px; }
h2 { font-size: 1.25rem; margin: 0; }
h3 { font-size: 1.02rem; margin: 22px 0 8px; }
p.lead { color: var(--muted); margin: 0 0 20px; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 18px; }
code, pre, textarea { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 13px; }
pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px;
  overflow-x: auto; margin: 0; white-space: pre; }
pre code.hljs { background: transparent; padding: 0; }
.fn-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.status-verified { background: var(--ok-soft); color: var(--ok); }
.status-compiled, .status-no_compiler { background: var(--warn-soft); color: var(--warn); }
.status-mismatch, .status-compile_error { background: var(--bad-soft); color: var(--bad); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 14px 0; }
.stat { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
.stat .k { color: var(--muted); font-size: 12px; }
.stat .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 2px 8px; font-size: 13px; }
.code-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.code-grid > *, .block-body > *, .stats > *, form .row > * { min-width: 0; }
pre { max-width: 100%; }
h2 code { word-break: break-all; }
@media (max-width: 860px) { .code-grid { grid-template-columns: 1fr; } }
details.block { border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; background: var(--panel); }
details.block summary { cursor: pointer; font-weight: 600; }
details.block summary .muted { font-weight: 400; }
.block-body { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0 6px; }
@media (max-width: 860px) { .block-body { grid-template-columns: 1fr; } }
.muted { color: var(--muted); }
.warn { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; border-bottom: 1px solid var(--border); padding: 6px 8px; vertical-align: top; }
ul.findings { padding-left: 18px; margin: 0; }
ul.findings li { margin-bottom: 4px; }
.table-wrap { overflow-x: auto; }
</style>
