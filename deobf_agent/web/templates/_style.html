<style>
:root {
  --bg: #fafaf8; --text: #1b1b1b; --muted: #5c5c58; --rule: #d9d9d3; --code: #f2f2ee;
  --accent: #1d5fa7; --ink: #ffffff; --ok: #1d7038; --warn: #8a5300; --bad: #b0281f; --lit: #8a4300;
  --sans: -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --text: #e7e6e1; --muted: #a3a29b; --rule: #36352f; --code: #1f1f1d;
    --accent: #86b4ee; --ink: #111111; --ok: #74c48e; --warn: #e2b35a; --bad: #f2897e; --lit: #e2a868;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans); }
main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px;
  border-bottom: 2px solid var(--text); padding-bottom: 8px; margin-bottom: 16px; }
h1 { font: 700 20px/1.2 var(--mono); margin: 0; }
header span { color: var(--muted); }
h2 { font-size: 17px; margin: 32px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--rule); }
h2 code { overflow-wrap: anywhere; }
h2.result { border-bottom: 2px solid var(--text); }
h3 { font-size: 15px; margin: 20px 0 6px; }
code, pre, textarea { font-family: var(--mono); font-size: 13px; line-height: 1.5; }
pre { margin: 0; background: var(--code); padding: 8px 10px; overflow-x: auto; white-space: pre; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.meta { color: var(--muted); font: 13px/1.6 var(--mono); margin: 4px 0 12px; }

/* tekshiruv holati: rangli so'z va chap chiziq */
.status { border-left: 4px solid currentColor; padding: 4px 10px; margin: 8px 0; }
.status span { color: var(--text); }
.status-verified { color: var(--ok); }
.status-compiled, .status-no_compiler { color: var(--warn); }
.status-mismatch, .status-compile_error { color: var(--bad); }
.error { color: var(--bad); border-left: 4px solid currentColor; padding: 4px 10px; }

/* asl va soddalashtirilgan kod yonma-yon */
.panes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.panes > * { min-width: 0; }
.src { display: flex; background: var(--code); overflow-x: auto; }
.src pre { overflow: visible; background: none; }
.src .ln { color: var(--muted); text-align: right; user-select: none; border-right: 1px solid var(--rule); padding-right: 8px; }
pre code.hljs { background: none; padding: 0; color: inherit; }
.hljs-keyword, .hljs-type, .hljs-built_in { color: var(--accent); }
.hljs-number, .hljs-string, .hljs-literal { color: var(--lit); }
.hljs-comment { color: var(--muted); font-style: italic; }
.hljs-title { font-weight: 600; }

/* bloklar bo'yicha tushuntirish */
ol.blocks { padding-left: 1.6em; margin: 0; }
ol.blocks li { margin: 0 0 16px; }
ol.blocks pre { margin: 4px 0; }
.del { color: var(--bad); }
.add { color: var(--ok); }
.expl { white-space: pre-line; margin: 4px 0 0; }

/* "Mutaxassis uchun" / "Oddiy tilda" almashtirgichi */
.mode { display: inline-flex; border: 1px solid var(--rule); margin: 4px 0 8px; }
.mode button { background: none; border: 0; padding: 4px 12px; min-height: 32px; color: var(--text); cursor: pointer; font: inherit; font-size: 14px; }
.mode button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.simple { display: none; }
.view-simple .simple { display: block; }
.view-simple .expert { display: none; }

table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.wrap { overflow-x: auto; }
details { margin: 8px 0; }
summary { cursor: pointer; }
details > *:not(summary) { margin-top: 8px; }
ul.plain { margin: 0; padding-left: 1.2em; }

/* forma */
label { font-size: 14px; }
textarea { width: 100%; min-height: 16em; resize: vertical; padding: 8px; border: 1px solid var(--rule);
  background: var(--code); color: var(--text); border-radius: 2px; }
select, input[type=text], input[type=password] { font: inherit; font-size: 14px; padding: 5px 6px; border: 1px solid var(--rule);
  background: var(--bg); color: var(--text); border-radius: 2px; max-width: 100%; }
.src-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 10px 0; }
.opts label { display: flex; align-items: center; gap: 6px; }
button, .filebtn { font: inherit; font-size: 14px; border-radius: 2px; cursor: pointer; padding: 6px 14px; min-height: 40px; }
button[type=submit] { background: var(--accent); color: var(--ink); border: 1px solid var(--accent); font-weight: 600; }
button[type=submit]:disabled { opacity: .6; cursor: wait; }
button.link, .filebtn { background: none; border: 1px solid var(--rule); color: var(--text); display: inline-flex; align-items: center; }
.filebtn input { display: none; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
#status { font-size: 14px; color: var(--muted); }
#status.ok { color: var(--ok); }
#status.bad { color: var(--bad); }

@media (max-width: 760px) {
  .panes { grid-template-columns: 1fr; }
  .panes .after { order: -1; }
  h2 { margin-top: 24px; }
}
@media (max-width: 560px) {
  textarea { min-height: 11em; }
  .opts label { flex: 1 1 100%; }
  .opts select, .opts input { flex: 1; }
}
</style>
